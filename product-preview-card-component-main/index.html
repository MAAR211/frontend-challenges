<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Product preview card component</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&display=swap"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1 class="sr-only">Gabrielle Essence Eau De Parfum Card</h1>

      <article class="card">
        <img
          class="card__image"
          src="./images/image-product-desktop.jpg"
          alt="Perfume bottle"
        />

        <section class="card__content">
          <span class="card__category">P E R F U M E</span>
          <h2 class="card__title">Gabrielle Essence Eau De Parfum</h2>
          <p class="card__description">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="card__price">
            <span class="card__price--current">$149.99</span>
            <span class="card__price--original">$169.99</span>
          </div>
          <button type="button" class="card__button">
            <img
              class="card__button-icon"
              src="./images/icon-cart.svg"
              alt="Cart icon"
            />
            Add to Cart
          </button>
        </section>
      </article>
    </main>
  </body>
</html>
