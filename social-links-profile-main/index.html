<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1 class="sr-only">Jessica Randall — Social Links Profile</h1>

      <article class="profile-card">
        <img
          src="assets/images/avatar-jessica.jpeg"
          alt="Jessica Randall"
          class="profile-card__avatar"
        />
        <h2 class="profile-card__name">Jessica Randall</h2>
        <p class="profile-card__location">London, United Kingdom</p>
        <p class="profile-card__description">
          "Front-end developer and avid reader."
        </p>
        <ul class="profile-card__social-links">
          <li>
            <a href="#" class="profile-card__social-link">GitHub</a>
          </li>
          <li>
            <a href="#" class="profile-card__social-link">Frontend Mentor</a>
          </li>
          <li>
            <a href="#" class="profile-card__social-link">LinkedIn</a>
          </li>
          <li>
            <a href="#" class="profile-card__social-link">Twitter</a>
          </li>
          <li>
            <a href="#" class="profile-card__social-link">Instagram</a>
          </li>
        </ul>
      </article>
    </main>
  </body>
</html>
