<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>
      Frontend Mentor | Huddle landing page with single introductory section
    </title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <img src="images/logo.svg" alt="huddle logo" class="huddle-logo" />
      <section class="hero">
        <img
          class="hero__image"
          src="images/illustration-mockups.svg"
          alt="Hero illustration"
        />
        <div class="hero__content">
          <h1 class="hero__title">Build The Community Your Fans Will Love</h1>
          <p class="hero__description">
            Huddle re-imagines the way we build communities. You have a voice,
            but so does your audience. Create connections with your users as you
            engage in genuine discussion.
          </p>
          <button class="hero__register-button" type="button">Register</button>
        </div>
      </section>

      <footer class="social-links" aria-label="Social media links">
        <ul class="social-links__list">
          <li>
            <a
              href="#"
              aria-label="Visit our Facebook page"
              class="social-link"
            >
              <i class="fab fa-facebook-f"></i>
            </a>
          </li>
          <li>
            <a href="#" aria-label="Visit our Twitter page" class="social-link">
              <i class="fab fa-twitter"></i>
            </a>
          </li>
          <li>
            <a
              href="#"
              aria-label="Visit our Instagram page"
              class="social-link"
            >
              <i class="fab fa-instagram"></i>
            </a>
          </li>
        </ul>
      </footer>
    </main>
  </body>
</html>
