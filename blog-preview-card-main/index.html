<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;800;900"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <article class="card">
      <img
        class="card__image"
        src="./assets/images/illustration-article.svg"
        alt="Blog preview card image"
      />

      <span class="card__category">Learning</span>
      <p class="card__date">Published 21 Dec 2023</p>
      <h1 class="card__title">HTML & CSS foundations</h1>
      <p class="card__description">
        These languages are the backbone of every website, defining structure,
        content, and presentation.
      </p>

      <div class="card__author">
        <img src="assets/images/image-avatar.webp" alt="author avatar" class="card__author-avatar" />
        <span class="card__author-name">Greg Hooper</span>
      </div>
      </article>
    </main>
  </body>
</html>
