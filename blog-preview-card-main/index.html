<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;800;900"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="blog-preview-card">
      <img
        class="blog-img"
        src="./assets/images/illustration-article.svg"
        alt="Blog preview card image"
      />

      <span class="blog-category">Learning</span>
      <p class="blog-date">Published 21 Dec 2023</p>
      <h2 class="blog-title">HTML & CSS foundations</h2>
      <p class="blog-description">
        These languages are the backbone of every website, defining structure,
        content, and presentation.
      </p>

      <div class="blog-author">
        <img src="assets/images/image-avatar.webp" alt="author avatar" class="author-avatar" />
        <span class="author-name">Greg Hooper</span>
      </div>
    </main>
  </body>
</html>
